services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shoppingstore}
      POSTGRES_USER: ${POSTGRES_USER:-shoppingstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shoppingstore}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shoppingstore}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    volumes:
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    ports:
      - "9000:80"
    depends_on:
      - web

volumes:
  postgres_data:
  static_data:
  media_data:
